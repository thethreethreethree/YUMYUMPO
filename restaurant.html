<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta id="meta-desc"  name="description"       content="Discover this restaurant on YUMYUMPO." />
  <meta id="og-title"   property="og:title"       content="YUMYUMPO" />
  <meta id="og-desc"    property="og:description" content="" />
  <meta id="og-image"   property="og:image"       content="" />
  <meta property="og:type" content="restaurant" />
  <title id="page-title">Restaurant — YUMYUMPO</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/styles.css" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'brand-yellow': '#FFD000',
            'brand-black':  '#111111',
            'yellow-light': '#FFF9D6',
            'gray-50':  '#F9F9F9',
            'gray-100': '#F3F3F3',
            'gray-200': '#E8E8E8',
            'gray-400': '#ABABAB',
            'gray-600': '#6B6B6B',
            'gray-800': '#333333',
          },
          fontFamily: {
            display: ['"Space Grotesk"', 'Inter', 'system-ui', 'sans-serif'],
            sans:    ['Inter', 'system-ui', 'sans-serif'],
          },
        },
      },
    }
  </script>

  <style>
    /* ── Gallery ── */
    .gallery-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      grid-template-rows: 260px 260px;
      gap: 6px;
      border-radius: 24px;
      overflow: hidden;
    }
    .gallery-grid .main-photo { grid-row: 1 / 3; }
    .gallery-grid img { width: 100%; height: 100%; object-fit: cover; display: block; }
    @media (max-width: 640px) {
      .gallery-grid { grid-template-columns: 1fr; grid-template-rows: 260px; }
      .gallery-grid .side-photo { display: none; }
    }

    /* ── Menu item card ── */
    .menu-item-card {
      background: #fff;
      border-radius: 16px;
      overflow: hidden;
      border: 1.5px solid #F3F3F3;
      transition: all 0.25s ease;
      display: flex;
      gap: 0;
    }
    .menu-item-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.09);
      border-color: #FFD000;
    }

    /* ── Mobile sticky bar ── */
    .mobile-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: rgba(255,255,255,0.97);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1.5px solid #E8E8E8;
      z-index: 50;
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    }

    /* ── Hours row ── */
    .hours-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1.5px solid #F3F3F3;
      background: #fff;
      transition: all 0.2s;
    }
    .hours-row.today {
      border-color: #FFD000;
      background: #FFF9D6;
    }

    /* ── Action buttons ── */
    .action-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 14px 18px;
      border-radius: 14px;
      font-size: 0.9375rem;
      font-weight: 700;
      transition: all 0.2s ease;
      text-decoration: none;
    }
    .action-btn:hover { transform: translateY(-2px); }
    .action-btn.yellow { background: #FFD000; color: #111111; }
    .action-btn.yellow:hover { background: #E6BB00; box-shadow: 0 8px 24px rgba(255,208,0,0.45); }
    .action-btn.black  { background: #111111; color: #fff; }
    .action-btn.black:hover  { background: #222; box-shadow: 0 8px 24px rgba(0,0,0,0.25); }
    .action-btn.green  { background: #22C55E; color: #fff; }
    .action-btn.green:hover  { background: #16A34A; box-shadow: 0 8px 24px rgba(34,197,94,0.35); }
    .action-btn.outline { background: #F3F3F3; color: #111111; border: 1.5px solid #E8E8E8; }
    .action-btn.outline:hover { background: #fff; border-color: #111; }

    /* ── Info rows ── */
    .info-row { display: flex; align-items: flex-start; gap: 12px; padding: 8px 0; }
    .info-icon { width: 36px; height: 36px; border-radius: 10px; background: #FFF9D6; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 1rem; }

    /* ── Tag pills ── */
    .r-tag {
      display: inline-flex;
      align-items: center;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 5px 12px;
      border-radius: 999px;
      letter-spacing: 0.02em;
    }
    .r-tag.yellow { background: #FFF9D6; color: #111; border: 1.5px solid rgba(255,208,0,0.5); }
    .r-tag.gray   { background: #F3F3F3; color: #6B6B6B; }
    .r-tag.black  { background: #111; color: #FFD000; }

    /* ── Back button ── */
    .back-btn {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 0.875rem; font-weight: 600; color: #6B6B6B;
      transition: color 0.2s;
    }
    .back-btn:hover { color: #111; }

    /* ── Section title ── */
    .r-section-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.375rem;
      font-weight: 800;
      color: #111;
      letter-spacing: -0.02em;
    }

    /* ── Sticky sidebar ── */
    .sticky-sidebar { position: sticky; top: 88px; }

    /* ── Skeleton pulse ── */
    .skel { background: linear-gradient(90deg,#F3F3F3 25%,#EBEBEB 50%,#F3F3F3 75%); background-size:200% 100%; animation: shimmer 1.5s infinite; border-radius: 10px; }
    @keyframes shimmer { from{background-position:200% 0} to{background-position:-200% 0} }
  </style>
</head>

<body class="bg-gray-50 font-sans text-brand-black antialiased pb-28 md:pb-0">

<!-- ══════════════════════════════════════════════════════════
     NAVIGATION
══════════════════════════════════════════════════════════ -->
<nav class="fixed top-0 left-0 right-0 z-50 bg-white border-b border-gray-200 shadow-sm">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-4">

    <!-- Logo -->
    <a href="index.html" class="flex items-center shrink-0">
      <img src="assets/images/YUMYUMPO LOGO.png" alt="YUMYUMPO" class="nav-logo-img" />
    </a>

    <!-- Back link -->
    <a href="discover.html" class="back-btn">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/>
      </svg>
      Back to Discover
    </a>

  </div>
</nav>


<!-- ══════════════════════════════════════════════════════════
     GALLERY
══════════════════════════════════════════════════════════ -->
<section class="pt-16 bg-white">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 pt-6 pb-0">
    <div class="gallery-grid" id="gallery-grid">
      <img class="main-photo" id="hero-cover" src="" alt="Restaurant" loading="eager"
           onerror="this.src='https://images.unsplash.com/photo-1414235077428-338989a2e8c0?w=1200&auto=format&fit=crop&q=80'" />
      <img class="side-photo" id="gallery-2"  src="" alt="Restaurant gallery" loading="lazy"
           onerror="this.src='https://images.unsplash.com/photo-1555396273-367ea4eb4db5?w=600&auto=format&fit=crop&q=75'" />
      <img class="side-photo" id="gallery-3"  src="" alt="Restaurant gallery" loading="lazy"
           onerror="this.src='https://images.unsplash.com/photo-1551218808-94e220e084d2?w=600&auto=format&fit=crop&q=75'" />
    </div>
  </div>
</section>


<!-- ══════════════════════════════════════════════════════════
     MAIN CONTENT
══════════════════════════════════════════════════════════ -->
<div class="max-w-7xl mx-auto px-4 sm:px-6 py-8">
  <div class="flex gap-10 items-start">

    <!-- ── LEFT: Content ───────────────────────────────── -->
    <div class="flex-1 min-w-0 space-y-10">

      <!-- ── RESTAURANT HEADER ── -->
      <div id="restaurant-header">
        <!-- Skeleton while loading -->
        <div class="flex items-start gap-4">
          <div class="w-16 h-16 rounded-2xl skel shrink-0"></div>
          <div class="flex-1">
            <div class="skel h-4 w-28 mb-3"></div>
            <div class="skel h-9 w-3/4 mb-3"></div>
            <div class="skel h-4 w-40"></div>
          </div>
        </div>
      </div>

      <!-- ── ABOUT ── -->
      <div id="about-section" class="hidden">
        <h2 class="r-section-title mb-3">About</h2>
        <p id="about-text" class="text-gray-600 text-base leading-relaxed"></p>
      </div>

      <!-- ── HOURS ── -->
      <div id="hours-section" class="hidden">
        <h2 class="r-section-title mb-4">Hours</h2>
        <div id="hours-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-2"></div>
      </div>

      <!-- ── MENU ── -->
      <div id="menu-section" class="hidden">
        <div class="flex items-end justify-between mb-6">
          <div>
            <h2 class="r-section-title">Menu</h2>
            <p class="text-gray-400 text-sm mt-1">Highlights from the kitchen</p>
          </div>
        </div>
        <div id="menu-container" class="space-y-8"></div>
      </div>

      <!-- ── LOCATION ── -->
      <div id="map-section" class="hidden">
        <h2 class="r-section-title mb-4">Location</h2>
        <div id="map-embed" class="rounded-2xl overflow-hidden h-72 bg-gray-100 flex items-center justify-center border border-gray-200">
          <p class="text-gray-400 text-sm">Loading map…</p>
        </div>
        <div class="flex items-start gap-3 mt-4 p-4 bg-white rounded-2xl border border-gray-200">
          <div class="info-icon shrink-0">📍</div>
          <div>
            <p class="text-xs text-gray-400 font-medium mb-0.5">Address</p>
            <p id="address-text" class="text-sm font-semibold text-brand-black"></p>
          </div>
        </div>
      </div>

    </div><!-- /left -->


    <!-- ── RIGHT: Sticky Sidebar (desktop) ───────────── -->
    <div class="hidden lg:block w-80 shrink-0">
      <div class="sticky-sidebar space-y-5">

        <!-- Actions -->
        <div id="action-card" class="bg-white rounded-2xl border border-gray-200 p-5 shadow-sm hidden">
          <h3 class="font-display font-black text-lg text-brand-black mb-4">Get in touch</h3>
          <div id="action-buttons" class="space-y-2.5"></div>
        </div>

        <!-- Quick Info -->
        <div id="info-card" class="bg-gray-50 rounded-2xl p-5 border border-gray-100 hidden">
          <h3 class="text-xs font-black text-gray-400 uppercase tracking-wider mb-4">Quick Info</h3>
          <div id="info-list" class="space-y-2"></div>
        </div>

        <!-- Social -->
        <div id="social-card" class="bg-white rounded-2xl border border-gray-200 p-5 shadow-sm hidden">
          <h3 class="text-xs font-black text-gray-400 uppercase tracking-wider mb-4">Follow Us</h3>
          <div id="social-links" class="flex flex-wrap gap-2"></div>
        </div>

        <!-- Share -->
        <button
          onclick="shareRestaurant()"
          class="action-btn outline w-full justify-center"
        >
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"/>
          </svg>
          Share this Restaurant
        </button>

      </div>
    </div>

  </div><!-- /flex -->
</div><!-- /main -->


<!-- ══════════════════════════════════════════════════════════
     MOBILE STICKY ACTION BAR
══════════════════════════════════════════════════════════ -->
<div class="mobile-bar lg:hidden" id="mobile-bar">
  <div class="flex gap-2 max-w-lg mx-auto">
    <button id="m-whatsapp" class="action-btn green flex-1 justify-center hidden text-sm py-3.5">
      <svg class="w-4 h-4 shrink-0" fill="currentColor" viewBox="0 0 24 24">
        <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
      </svg>
      WhatsApp
    </button>
    <button id="m-call" class="action-btn black flex-1 justify-center hidden text-sm py-3.5">
      <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.948V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 7V5z"/>
      </svg>
      Call
    </button>
    <button id="m-website" class="action-btn yellow flex-1 justify-center hidden text-sm py-3.5">
      <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
      </svg>
      Website
    </button>
  </div>
</div>


<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/restaurant.js"></script>

<script>
/* ── Page-level helpers wired to the updated brand ── */

window.shareRestaurant = function() {
  const url  = window.location.href;
  const name = document.getElementById('page-title')?.textContent?.replace(' — YUMYUMPO','') || 'this restaurant';
  if (navigator.share) {
    navigator.share({ title: name, url }).catch(() => {});
  } else {
    navigator.clipboard?.writeText(url).then(() => {
      const btn = document.querySelector('[onclick="shareRestaurant()"]');
      if (btn) {
        const original = btn.innerHTML;
        btn.innerHTML = `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg> Link copied!`;
        setTimeout(() => btn.innerHTML = original, 2000);
      }
    });
  }
};
</script>
</body>
</html>
