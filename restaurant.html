<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Dynamic SEO — populated by JS -->
  <meta id="meta-desc"     name="description"        content="Discover this amazing restaurant on YUMYUMPO." />
  <meta id="og-title"      property="og:title"        content="YUMYUMPO Restaurant" />
  <meta id="og-desc"       property="og:description"  content="" />
  <meta id="og-image"      property="og:image"        content="" />
  <meta property="og:type" content="restaurant" />
  <title id="page-title">Restaurant — YUMYUMPO</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/styles.css" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'warm-white':  '#FAFAF8',
            'warm-beige':  '#F5EDE0',
            'warm-orange': '#F97316',
            'warm-amber':  '#FB923C',
            'charcoal':    '#1C1917',
            'stone-mid':   '#78716C',
            'stone-light': '#D6D3D1',
            'stone-pale':  '#F5F5F4',
          },
          fontFamily: {
            display: ['"Playfair Display"', 'Georgia', 'serif'],
            sans:    ['Inter', 'system-ui', 'sans-serif'],
          },
        },
      },
    }
  </script>

  <style>
    .menu-item-card {
      background: #fff;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }
    .menu-item-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.1);
    }
    .hero-cover {
      background: linear-gradient(to bottom, rgba(28,25,23,0.2) 0%, rgba(28,25,23,0.7) 100%);
    }
    .sticky-action-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: rgba(250,250,248,0.95);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid #E7E5E4;
      z-index: 40;
      padding: 12px 16px;
    }
    .gallery-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      grid-template-rows: 240px 240px;
      gap: 8px;
      border-radius: 20px;
      overflow: hidden;
    }
    .gallery-grid .main-photo { grid-row: 1 / 3; }
    .gallery-grid img { width:100%; height:100%; object-fit:cover; }
    @media (max-width: 640px) {
      .gallery-grid { grid-template-columns: 1fr; grid-template-rows: 260px; }
      .gallery-grid .side-photo { display: none; }
    }
  </style>
</head>

<body class="bg-warm-white font-sans text-charcoal antialiased pb-24 md:pb-0">

  <!-- ── NAV ── -->
  <nav class="fixed top-0 left-0 right-0 z-50 bg-warm-white/95 backdrop-blur-md border-b border-stone-light/60 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2 group">
        <div class="w-8 h-8 rounded-lg bg-warm-orange flex items-center justify-center group-hover:scale-105 transition-transform">
          <span class="text-white font-bold text-sm">Y</span>
        </div>
        <span class="font-display font-bold text-lg text-charcoal">YUMYUMPO</span>
      </a>
      <a href="index.html" class="inline-flex items-center gap-1.5 text-sm font-medium text-stone-mid hover:text-charcoal transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
        </svg>
        Back to Discover
      </a>
    </div>
  </nav>


  <!-- ── HERO GALLERY ── -->
  <section class="pt-16">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 pt-8">
      <div class="gallery-grid" id="gallery-grid">
        <img class="main-photo" id="hero-cover" src="" alt="Restaurant cover" loading="eager" />
        <img class="side-photo" id="gallery-2"  src="" alt="Restaurant gallery" loading="lazy" />
        <img class="side-photo" id="gallery-3"  src="" alt="Restaurant gallery" loading="lazy" />
      </div>
    </div>
  </section>


  <!-- ── MAIN LAYOUT ── -->
  <div class="max-w-7xl mx-auto px-4 sm:px-6 py-10">
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-10">

      <!-- LEFT: Main Content -->
      <div class="lg:col-span-2 space-y-12">

        <!-- Restaurant Header -->
        <div id="restaurant-header">
          <!-- Injected by JS -->
          <div class="animate-pulse">
            <div class="h-6 bg-stone-pale rounded w-32 mb-4"></div>
            <div class="h-10 bg-stone-pale rounded w-3/4 mb-4"></div>
            <div class="h-5 bg-stone-pale rounded w-1/2"></div>
          </div>
        </div>

        <!-- About -->
        <div id="about-section" class="hidden">
          <h2 class="font-display text-2xl font-bold text-charcoal mb-4">About</h2>
          <p id="about-text" class="text-stone-mid text-base leading-relaxed"></p>
        </div>

        <!-- Hours -->
        <div id="hours-section" class="hidden">
          <h2 class="font-display text-2xl font-bold text-charcoal mb-5">Hours</h2>
          <div id="hours-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-3"></div>
        </div>

        <!-- Menu -->
        <div id="menu-section" class="hidden">
          <h2 class="font-display text-2xl font-bold text-charcoal mb-2">Menu</h2>
          <p class="text-stone-mid text-sm mb-8">Highlights from the kitchen</p>
          <div id="menu-container" class="space-y-10"></div>
        </div>

        <!-- Map -->
        <div id="map-section" class="hidden">
          <h2 class="font-display text-2xl font-bold text-charcoal mb-5">Location</h2>
          <div id="map-embed" class="rounded-2xl overflow-hidden h-72 bg-stone-pale flex items-center justify-center">
            <p class="text-stone-mid text-sm">Map loading...</p>
          </div>
          <p id="address-text" class="text-stone-mid text-sm mt-3 flex items-center gap-1.5">
            <svg class="w-4 h-4 text-warm-orange shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
            </svg>
            <span></span>
          </p>
        </div>

      </div>

      <!-- RIGHT: Info Sidebar -->
      <div class="lg:col-span-1">
        <div class="sticky top-24 space-y-6">

          <!-- Action Card -->
          <div id="action-card" class="bg-white rounded-2xl shadow-lg border border-stone-light/60 p-6 hidden">
            <h3 class="font-display text-xl font-bold text-charcoal mb-5">Get in touch</h3>
            <div id="action-buttons" class="space-y-3"></div>
          </div>

          <!-- Quick Info Card -->
          <div id="info-card" class="bg-stone-pale rounded-2xl p-6 hidden">
            <h3 class="text-sm font-semibold text-charcoal mb-4">Quick Info</h3>
            <div id="info-list" class="space-y-3"></div>
          </div>

          <!-- Social Card -->
          <div id="social-card" class="bg-white rounded-2xl border border-stone-light/60 p-6 hidden">
            <h3 class="text-sm font-semibold text-charcoal mb-4">Follow Us</h3>
            <div id="social-links" class="flex gap-3"></div>
          </div>

        </div>
      </div>

    </div>
  </div>


  <!-- ── STICKY MOBILE ACTION BAR ── -->
  <div class="sticky-action-bar md:hidden" id="mobile-action-bar">
    <div class="flex gap-2 max-w-lg mx-auto">
      <button
        id="mobile-whatsapp"
        class="flex-1 hidden bg-green-500 hover:bg-green-600 text-white font-semibold py-3.5 rounded-xl flex items-center justify-center gap-2 transition-colors text-sm"
      >
        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
          <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
        </svg>
        WhatsApp
      </button>
      <button
        id="mobile-call"
        class="flex-1 hidden bg-charcoal hover:bg-stone-800 text-white font-semibold py-3.5 rounded-xl flex items-center justify-center gap-2 transition-colors text-sm"
      >
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.948V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 7V5z"/>
        </svg>
        Call
      </button>
      <button
        id="mobile-website"
        class="flex-1 hidden bg-warm-orange hover:bg-warm-amber text-white font-semibold py-3.5 rounded-xl flex items-center justify-center gap-2 transition-colors text-sm"
      >
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
        </svg>
        Website
      </button>
    </div>
  </div>


  <script src="assets/js/supabase-client.js"></script>
  <script src="assets/js/restaurant.js"></script>
</body>
</html>
