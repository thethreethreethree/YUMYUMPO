<head>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/styles.css" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'brand-yellow': '#FFD000',
            'brand-black':  '#111111',
            'yellow-light': '#FFF9D6',
            'gray-50':  '#F9F9F9',
            'gray-100': '#F3F3F3',
            'gray-200': '#E8E8E8',
            'gray-400': '#ABABAB',
            'gray-600': '#6B6B6B',
            'gray-800': '#333333',
          },
          fontFamily: {
            display: ['"Space Grotesk"', 'Inter', 'system-ui', 'sans-serif'],
            sans:    ['Inter', 'system-ui', 'sans-serif'],
          },
        },
      },
    }
  </script>

  <style>
    /* ══ NAV — transparent → solid on scroll ══ */
    #r-nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 50;
      transition: background 0.3s ease, box-shadow 0.3s ease;
    }
    #r-nav.solid {
      background: rgba(255,255,255,0.97);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 1px 0 rgba(0,0,0,0.08);
    }
    #r-nav .nav-logo-img { height: 36px; width: auto; }
    #r-nav .nav-back {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 0.875rem; font-weight: 600;
      color: rgba(255,255,255,0.9);
      transition: color 0.2s;
    }
    #r-nav.solid .nav-back { color: #6B6B6B; }
    #r-nav .nav-back:hover { color: #fff; }
    #r-nav.solid .nav-back:hover { color: #111; }
    #r-nav .nav-share-btn {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 0.8125rem; font-weight: 700;
      background: rgba(255,255,255,0.15);
      color: #fff;
      border: 1.5px solid rgba(255,255,255,0.3);
      padding: 7px 14px; border-radius: 999px;
      transition: all 0.2s;
    }
    #r-nav.solid .nav-share-btn {
      background: #F3F3F3; color: #111;
      border-color: #E8E8E8;
    }
    #r-nav .nav-share-btn:hover { background: #FFD000; color: #111; border-color: #FFD000; }

    /* ══ CINEMATIC HERO ══ */
    .r-hero {
      position: relative;
      min-height: 88vh;
      display: flex; flex-direction: column;
      justify-content: flex-end;
      overflow: hidden;
    }
    .r-hero-bg {
      position: absolute; inset: 0;
      background: #111 center/cover no-repeat;
      transition: transform 0.1s linear;
      will-change: transform;
    }
    .r-hero-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(
        to top,
        rgba(10,10,10,0.95) 0%,
        rgba(10,10,10,0.65) 40%,
        rgba(10,10,10,0.25) 70%,
        rgba(10,10,10,0.10) 100%
      );
    }
    .r-hero-content {
      position: relative; z-index: 10;
      padding: 0 1.5rem 3rem;
      max-width: 900px;
    }
    @media (min-width: 640px) { .r-hero-content { padding: 0 3rem 4rem; } }

    /* Scroll arrow */
    .hero-scroll-arrow {
      position: absolute; bottom: 1.5rem; right: 1.5rem; z-index: 10;
      width: 42px; height: 42px; border-radius: 50%;
      background: rgba(255,255,255,0.12);
      border: 1.5px solid rgba(255,255,255,0.25);
      display: flex; align-items: center; justify-content: center;
      animation: arrowBounce 2s ease-in-out infinite;
      cursor: pointer;
    }
    @keyframes arrowBounce {
      0%,100% { transform: translateY(0); }
      50%      { transform: translateY(5px); }
    }

    /* ══ PHOTO GALLERY MOSAIC ══ */
    .gallery-mosaic {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      grid-template-rows: 220px 220px;
      gap: 4px;
    }
    .gallery-mosaic .gm-main   { grid-row: 1 / 3; }
    .gallery-mosaic .gm-photo  { overflow: hidden; cursor: pointer; }
    .gallery-mosaic .gm-photo img {
      width: 100%; height: 100%; object-fit: cover;
      transition: transform 0.5s ease;
    }
    .gallery-mosaic .gm-photo:hover img { transform: scale(1.05); }
    .gallery-mosaic .gm-more {
      position: relative; overflow: hidden; cursor: pointer;
    }
    .gallery-mosaic .gm-more img { width:100%; height:100%; object-fit:cover; }
    .gallery-mosaic .gm-more-overlay {
      position: absolute; inset: 0;
      background: rgba(17,17,17,0.65);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 4px;
      transition: background 0.2s;
    }
    .gallery-mosaic .gm-more:hover .gm-more-overlay { background: rgba(17,17,17,0.75); }
    @media (max-width: 640px) {
      .gallery-mosaic {
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 200px 130px;
      }
      .gallery-mosaic .gm-main { grid-column: 1 / 3; grid-row: 1; }
      .gallery-mosaic .gm-photo:nth-child(3) { display: none; }
    }

    /* ══ SECTION DIVIDER ══ */
    .r-divider { height: 1px; background: #F3F3F3; margin: 2rem 0; }

    /* ══ SECTION TITLE ══ */
    .r-section-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.375rem; font-weight: 800;
      color: #111; letter-spacing: -0.02em;
    }

    /* ══ TAG PILLS ══ */
    .r-tag {
      display: inline-flex; align-items: center;
      font-size: 0.75rem; font-weight: 700;
      padding: 5px 12px; border-radius: 999px;
    }
    .r-tag.yellow { background: #FFF9D6; color: #111; border: 1.5px solid rgba(255,208,0,0.5); }
    .r-tag.gray   { background: #F3F3F3; color: #6B6B6B; }
    .r-tag.black  { background: #111; color: #FFD000; }
    .r-tag.white  { background: rgba(255,255,255,0.15); color: #fff; border: 1.5px solid rgba(255,255,255,0.25); backdrop-filter: blur(4px); }

    /* ══ HOURS ══ */
    .hours-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 14px; border-radius: 12px;
      border: 1.5px solid #F3F3F3; background: #fff;
      transition: all 0.2s;
    }
    .hours-row.today { border-color: #FFD000; background: #FFFBEB; }
    .open-badge  { display: inline-flex; align-items: center; gap: 5px; background: #DCFCE7; color: #15803D; font-size: 0.7rem; font-weight: 800; padding: 3px 9px; border-radius: 999px; }
    .closed-badge{ display: inline-flex; align-items: center; gap: 5px; background: #FEE2E2; color: #DC2626; font-size: 0.7rem; font-weight: 800; padding: 3px 9px; border-radius: 999px; }

    /* ══ MENU ══ */
    .menu-card {
      background: #fff; border-radius: 18px;
      border: 1.5px solid #F3F3F3; overflow: hidden;
      transition: all 0.3s cubic-bezier(0.34,1.4,0.64,1);
    }
    .menu-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 32px rgba(0,0,0,0.10);
      border-color: #FFD000;
    }
    .menu-card-image {
      aspect-ratio: 16/9; overflow: hidden;
      background: #F3F3F3; position: relative;
    }
    .menu-card-image img {
      width: 100%; height: 100%; object-fit: cover;
      transition: transform 0.45s ease;
    }
    .menu-card:hover .menu-card-image img { transform: scale(1.06); }
    .menu-card-body { padding: 1rem 1rem 1.125rem; }
    .menu-price {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.125rem; font-weight: 800;
      color: #111; letter-spacing: -0.02em;
    }
    .menu-tag {
      display: inline-flex; font-size: 0.675rem; font-weight: 800;
      padding: 3px 9px; border-radius: 999px;
      background: #FFF9D6; color: #8A6900;
      border: 1px solid rgba(255,208,0,0.4);
    }

    /* ══ FOOD GALLERY ══ */
    .food-gallery-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }
    .food-gallery-grid .fg-photo {
      aspect-ratio: 1; overflow: hidden; border-radius: 12px;
      cursor: pointer;
    }
    .food-gallery-grid .fg-photo img {
      width: 100%; height: 100%; object-fit: cover;
      transition: transform 0.4s ease;
    }
    .food-gallery-grid .fg-photo:hover img { transform: scale(1.08); }
    @media (max-width: 640px) {
      .food-gallery-grid { grid-template-columns: repeat(2, 1fr); }
    }

    /* ══ ACTION BUTTONS ══ */
    .r-action-btn {
      display: flex; align-items: center; gap: 10px;
      width: 100%; padding: 14px 18px; border-radius: 14px;
      font-size: 0.9375rem; font-weight: 700;
      text-decoration: none; transition: all 0.2s ease;
    }
    .r-action-btn:hover { transform: translateY(-2px); }
    .r-action-btn.green  { background: #22C55E; color: #fff; }
    .r-action-btn.green:hover  { background: #16A34A; box-shadow: 0 8px 24px rgba(34,197,94,0.35); }
    .r-action-btn.yellow { background: #FFD000; color: #111; }
    .r-action-btn.yellow:hover { background: #E6BB00; box-shadow: 0 8px 24px rgba(255,208,0,0.45); }
    .r-action-btn.black  { background: #111; color: #fff; }
    .r-action-btn.black:hover  { background: #222; box-shadow: 0 8px 24px rgba(0,0,0,0.25); }
    .r-action-btn.blue   { background: #1877F2; color: #fff; }
    .r-action-btn.blue:hover   { background: #1565D8; box-shadow: 0 8px 24px rgba(24,119,242,0.35); }
    .r-action-btn.pink   { background: linear-gradient(135deg,#F58529,#DD2A7B,#8134AF); color: #fff; }
    .r-action-btn.pink:hover   { box-shadow: 0 8px 24px rgba(221,42,123,0.35); }
    .r-action-btn.outline{ background: #F3F3F3; color: #111; border: 1.5px solid #E8E8E8; }
    .r-action-btn.outline:hover{ background: #fff; border-color: #111; }

    /* ══ INFO ROWS ══ */
    .info-row { display: flex; align-items: flex-start; gap: 12px; padding: 8px 0; }
    .info-icon {
      width: 38px; height: 38px; border-radius: 11px;
      background: #FFF9D6; display: flex; align-items: center;
      justify-content: center; flex-shrink: 0; font-size: 1.0625rem;
    }

    /* ══ MOBILE STICKY BAR ══ */
    .r-mobile-bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(255,255,255,0.97);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border-top: 1.5px solid #E8E8E8; z-index: 50;
      padding: 12px 16px;
      padding-bottom: calc(12px + env(safe-area-inset-bottom));
    }

    /* ══ HERO MOBILE BUTTON ROW ══ */
    .hero-action-row {
      display: flex; gap: 10px; margin-top: 1.5rem; flex-wrap: wrap;
    }
    .hero-btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 12px 20px; border-radius: 14px;
      font-size: 0.9rem; font-weight: 700;
      text-decoration: none; transition: all 0.2s;
      white-space: nowrap;
    }
    .hero-btn.yellow { background: #FFD000; color: #111; }
    .hero-btn.yellow:hover { background: #E6BB00; box-shadow: 0 8px 24px rgba(255,208,0,0.5); transform: translateY(-2px); }
    .hero-btn.ghost  {
      background: rgba(255,255,255,0.12);
      border: 1.5px solid rgba(255,255,255,0.3);
      color: #fff; backdrop-filter: blur(6px);
    }
    .hero-btn.ghost:hover { background: rgba(255,255,255,0.22); transform: translateY(-2px); }

    /* ══ SKELETON ══ */
    .skel { background: linear-gradient(90deg,rgba(255,255,255,0.08) 25%,rgba(255,255,255,0.18) 50%,rgba(255,255,255,0.08) 75%); background-size:200% 100%; animation:shimmer 1.5s infinite; border-radius:8px; }
    @keyframes shimmer { from{background-position:200% 0} to{background-position:-200% 0} }
    .skel-light { background: linear-gradient(90deg,#F3F3F3 25%,#EBEBEB 50%,#F3F3F3 75%); background-size:200% 100%; animation:shimmer 1.5s infinite; border-radius:8px; }

    /* ══ BREADCRUMB ══ */
    .breadcrumb { display: flex; align-items: center; gap: 6px; font-size: 0.8125rem; color: rgba(255,255,255,0.55); margin-bottom: 1.5rem; }
    .breadcrumb a { color: rgba(255,255,255,0.55); text-decoration: none; transition: color 0.2s; }
    .breadcrumb a:hover { color: #FFD000; }
    .breadcrumb span { color: rgba(255,255,255,0.35); }

    /* ══ SCROLL REVEAL ══ */
    .r-reveal { opacity: 0; transform: translateY(20px); transition: opacity 0.55s ease, transform 0.55s ease; }
    .r-reveal.visible { opacity: 1; transform: translateY(0); }
    .r-delay-1 { transition-delay: 0.08s; }
    .r-delay-2 { transition-delay: 0.16s; }
    .r-delay-3 { transition-delay: 0.24s; }

    /* ══ SIMILAR RESTAURANTS CARD ══ */
    .similar-card {
      background: #fff; border-radius: 16px; overflow: hidden;
      border: 1.5px solid #F3F3F3;
      transition: all 0.3s cubic-bezier(0.34,1.4,0.64,1);
      cursor: pointer;
    }
    .similar-card:hover { transform: translateY(-4px); box-shadow: 0 12px 28px rgba(0,0,0,0.10); border-color: transparent; }
    .similar-card-image { aspect-ratio: 3/2; overflow: hidden; }
    .similar-card-image img { width:100%; height:100%; object-fit:cover; transition: transform 0.4s ease; }
    .similar-card:hover .similar-card-image img { transform: scale(1.06); }
  </style>
</head>

     PHOTO GALLERY MOSAIC

    <!-- ── RIGHT: Sticky sidebar (desktop only) ─────────── -->

<script src="assets/js/restaurant.js"></script>

<script>
/* ── Share ── */
window.shareRestaurant = function () {
  const title = document.getElementById('page-title')?.textContent?.replace(' — YUMYUMPO','') || 'Check out this restaurant';
  if (navigator.share) {
    navigator.share({ title, url: window.location.href }).catch(() => {});
  } else {
    navigator.clipboard?.writeText(window.location.href).then(() => {
      const btn = document.querySelector('.nav-share-btn');
      if (btn) {
        const orig = btn.innerHTML;
        btn.innerHTML = `<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg> Copied!`;
        setTimeout(() => btn.innerHTML = orig, 2000);
      }
    });
  }
};

/* ── About expand/collapse ── */
window.toggleAbout = function () {
  const p   = document.getElementById('about-text');
  const btn = document.getElementById('about-toggle');
  if (!p || !btn) return;
  if (p.classList.contains('line-clamp-4')) {
    p.classList.remove('line-clamp-4');
    btn.textContent = 'Show less';
  } else {
    p.classList.add('line-clamp-4');
    btn.textContent = 'Show more';
  }
};
</script>
