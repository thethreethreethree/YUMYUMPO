<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" href="../assets/images/favicon.png" type="image/png" />
<title>Printable Menu QR — YUMYUMPO</title>
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0;
      -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body { font-family: 'Inter', sans-serif; background: #1a1a1a; color: #111;
         display: flex; flex-direction: column; align-items: center; }
  .font-d { font-family: 'Space Grotesk', sans-serif; }

  /* ── Toolbar (screen only) ── */
  .toolbar {
    position: sticky; top: 0; z-index: 50; width: 100%;
    background: #111; color: #fff; padding: 14px 20px;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    justify-content: center; box-shadow: 0 4px 18px rgba(0,0,0,.4);
  }
  .toolbar .tb-title { font-weight: 800; font-size: .95rem; margin-right: auto; }
  @media (max-width: 640px){ .toolbar .tb-title { margin-right: 0; width: 100%; text-align:center } }
  .tb-seg { display: flex; background: #2a2a2a; border-radius: 12px; padding: 4px; }
  .tb-seg button {
    border: 0; background: transparent; color: #bbb; font-weight: 700;
    font-size: .8rem; padding: 8px 16px; border-radius: 9px; cursor: pointer;
    font-family: 'Inter', sans-serif; transition: .15s;
  }
  .tb-seg button.active { background: #FFD000; color: #111; }
  .tb-print {
    border: 0; background: #FFD000; color: #111; font-weight: 800;
    font-size: .85rem; padding: 10px 22px; border-radius: 11px; cursor: pointer;
    font-family: 'Inter', sans-serif;
  }
  .tb-print:hover { filter: brightness(.95); }
  .tb-back { color: #999; text-decoration: none; font-size: .8rem; font-weight: 600; }
  .tb-back:hover { color: #fff; }

  .stage { padding: 32px 16px 60px; display: flex; justify-content: center; }
  .hint { color: #888; font-size: .78rem; text-align: center; max-width: 460px;
          margin: 0 auto 8px; }

  /* ── A4 sheet — 6mm safe margin so no printer clips the artwork ── */
  .sheet {
    width: 210mm; height: 297mm; background: #fff; padding: 6mm;
    box-shadow: 0 20px 60px rgba(0,0,0,.5); overflow: hidden; position: relative;
  }

  /* QR corner brackets — shared */
  .qbr { position: absolute; border: solid #FFD000; }
  .qbr.tl { border-width: 3px 0 0 3px; }
  .qbr.tr { border-width: 3px 3px 0 0; }
  .qbr.bl { border-width: 0 0 3px 3px; }
  .qbr.br { border-width: 0 3px 3px 0; }

  /* ===== Layout A — 4 quarter posters ===== */
  .quad { position: relative; display: grid; grid-template-columns: 1fr 1fr;
          grid-template-rows: 1fr 1fr; height: 100%; }

  /* scissors cut guides — centre cross */
  .cutlines { position: absolute; inset: 0; z-index: 6; pointer-events: none; }
  .cutlines .cl-v {
    position: absolute; left: 50%; top: 0; bottom: 0;
    border-left: 1.4px dashed #b0b0b0; transform: translateX(-50%);
  }
  .cutlines .cl-h {
    position: absolute; top: 50%; left: 0; right: 0;
    border-top: 1.4px dashed #b0b0b0; transform: translateY(-50%);
  }
  .cutlines .sc {
    position: absolute; font-size: 10pt; color: #9a9a9a; background: #fff;
    line-height: 1; padding: .5mm;
  }
  .cutlines .sc-t { left: 50%; top: 0; transform: translate(-50%,-52%); }
  .cutlines .sc-b { left: 50%; bottom: 0; transform: translate(-50%,52%); }
  .cutlines .sc-l { top: 50%; left: 0; transform: translate(-52%,-50%); }
  .cutlines .sc-r { top: 50%; right: 0; transform: translate(52%,-50%); }
  .qp {
    position: relative; height: 100%; overflow: hidden; background: #fff;
    display: flex; flex-direction: column; align-items: center;
    text-align: center; padding: 0 7mm 6mm;
  }
  /* decorative soft blob bottom-right */
  .qp::before {
    content: ''; position: absolute; width: 50mm; height: 50mm; border-radius: 50%;
    background: rgba(255,208,0,.14); bottom: -22mm; left: -20mm;
  }
  /* yellow angled header band */
  .qp-band {
    width: 100%; background: #FFD000; color: #111; padding: 6mm 4mm 9mm;
    clip-path: polygon(0 0, 100% 0, 100% 72%, 50% 100%, 0 72%);
    display: flex; flex-direction: column; align-items: center;
  }
  .qp-band .bw { font-weight: 800; font-size: 15pt; letter-spacing: .5px; }
  .qp-band .bw .dot { color: #fff; }
  .qp-band .bs {
    font-size: 6.4pt; font-weight: 800; letter-spacing: 1.6px;
    text-transform: uppercase; margin-top: 1mm; opacity: .62;
  }
  .qp-head {
    position: relative; z-index: 2; font-weight: 800; font-size: 17pt;
    line-height: 1.08; color: #111; margin-top: 6mm; letter-spacing: -.4px;
  }
  .qp-head .hl { color: #C9A100; }
  .qp-qr-wrap { position: relative; z-index: 2; margin: 6mm 0 0; }
  .qp-qr { background: #fff; border: 3px solid #111; border-radius: 12px; padding: 3.5mm; }
  .qp-qr img { display: block; width: 35mm; height: 35mm; }
  .qp-qr-wrap .qbr { width: 6mm; height: 6mm; }
  .qp-qr-wrap .qbr.tl { top: -2.5mm; left: -2.5mm; }
  .qp-qr-wrap .qbr.tr { top: -2.5mm; right: -2.5mm; }
  .qp-qr-wrap .qbr.bl { bottom: -2.5mm; left: -2.5mm; }
  .qp-qr-wrap .qbr.br { bottom: -2.5mm; right: -2.5mm; }
  .qp-scan {
    position: relative; z-index: 2; font-size: 7.4pt; font-weight: 700;
    color: #8a8a8a; margin-top: 3.5mm; letter-spacing: .2px;
  }
  .qp-name {
    position: relative; z-index: 2; margin-top: auto; background: #111; color: #fff;
    font-weight: 800; font-size: 11pt; padding: 2.6mm 6mm; border-radius: 999px;
    max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .qp-foot {
    position: relative; z-index: 2; font-size: 6.8pt; font-weight: 800;
    color: #aaa; margin-top: 2.6mm; letter-spacing: .4px; text-transform: uppercase;
  }
  .qp-foot b { color: #C9A100; }

  /* ===== Layout B — single showcase poster ===== */
  .solo { height: 100%; display: flex; flex-direction: column; background: #fff; }
  .solo-hero {
    position: relative; height: 95mm; background: #111 center/cover no-repeat;
    display: flex; flex-direction: column; align-items: center;
    justify-content: flex-end; padding: 0 16mm 12mm; text-align: center;
  }
  .solo-hero::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,.2) 0%, rgba(0,0,0,.38) 45%, rgba(0,0,0,.85) 100%);
  }
  .solo-hero > * { position: relative; z-index: 2; }
  .solo-topbrand {
    position: absolute; top: 8mm; left: 0; right: 0; z-index: 3;
    color: #fff; font-weight: 800; font-size: 13pt; letter-spacing: 1.5px;
  }
  .solo-topbrand .dot { color: #FFD000; }
  .solo-logo {
    width: 24mm; height: 24mm; border-radius: 50%; background: #fff center/cover no-repeat;
    border: 4px solid #FFD000; box-shadow: 0 8px 24px rgba(0,0,0,.55);
    display: flex; align-items: center; justify-content: center; font-size: 26pt;
    margin-bottom: 5mm;
  }
  .solo-name {
    font-weight: 800; font-size: 28pt; color: #fff; line-height: 1.04;
    letter-spacing: -.5px; text-shadow: 0 2px 14px rgba(0,0,0,.55);
  }
  .solo-cuisine {
    margin-top: 4mm; color: #111; background: #FFD000; font-weight: 800;
    font-size: 9.5pt; padding: 2mm 6mm; border-radius: 999px; display: inline-block;
    letter-spacing: .5px; text-transform: uppercase;
  }
  /* yellow angled CTA strip */
  .solo-strip {
    background: #FFD000; color: #111; text-align: center; padding: 5mm 12mm 8mm;
    clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 76%, 0 100%); margin-top: -1mm;
  }
  .solo-strip .st { font-weight: 800; font-size: 16pt; letter-spacing: -.3px; }
  .solo-strip .ss {
    font-size: 8pt; font-weight: 800; letter-spacing: 1.8px;
    text-transform: uppercase; opacity: .6; margin-top: 1.5mm;
  }
  .solo-body {
    flex: 1; position: relative; background: #fff;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; padding: 4mm 14mm 8mm; overflow: hidden;
  }
  .solo-body::before, .solo-body::after {
    content: ''; position: absolute; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,208,0,.34), rgba(255,208,0,0) 70%);
  }
  .solo-body::before { width: 82mm; height: 82mm; top: -28mm; left: -30mm; }
  .solo-body::after  { width: 72mm; height: 72mm; bottom: -26mm; right: -26mm; }
  .solo-qr-wrap { position: relative; z-index: 2; }
  .solo-qr {
    background: #fff; border: 5px solid #111; border-radius: 20px; padding: 5mm;
    box-shadow: 10px 10px 0 #FFD000;
  }
  .solo-qr img { display: block; width: 54mm; height: 54mm; }
  .solo-qr-wrap .qbr { width: 11mm; height: 11mm; }
  .solo-qr-wrap .qbr.tl { top: -5mm; left: -5mm; }
  .solo-qr-wrap .qbr.tr { top: -5mm; right: -5mm; }
  .solo-qr-wrap .qbr.bl { bottom: -5mm; left: -5mm; }
  .solo-qr-wrap .qbr.br { bottom: -5mm; right: -5mm; }
  .solo-scan {
    position: relative; z-index: 2; font-weight: 800; font-size: 11pt;
    color: #111; margin-top: 6mm; letter-spacing: .2px;
  }
  /* feature chips */
  .solo-feats {
    position: relative; z-index: 2; display: flex; gap: 3mm; margin-top: 7mm;
  }
  .solo-feat {
    background: #FFFBE6; border: 1.6px solid #FFD000; border-radius: 11px;
    padding: 3.2mm 1mm; width: 37mm; text-align: center;
  }
  .solo-feat .fi { line-height: 0; }
  .solo-feat .fi svg { width: 8mm; height: 8mm; color: #111; }
  .solo-feat .fl {
    font-size: 7.4pt; font-weight: 800; color: #111; margin-top: 1.6mm;
    letter-spacing: .2px;
  }
  /* steps */
  .solo-steps {
    position: relative; z-index: 2; display: flex; gap: 7mm; margin-top: 8mm;
  }
  .solo-step { display: flex; flex-direction: column; align-items: center; max-width: 38mm; }
  .solo-step .n {
    width: 9mm; height: 9mm; border-radius: 50%; background: #111; color: #FFD000;
    font-weight: 800; font-size: 11pt; display: flex; align-items: center;
    justify-content: center; margin-bottom: 2mm;
  }
  .solo-step .t { font-size: 8pt; color: #555; font-weight: 700; text-align: center; }
  .solo-foot {
    background: #111; color: #fff; padding: 7mm 16mm;
    display: flex; align-items: center; justify-content: space-between;
  }
  .solo-foot .fb { font-weight: 800; font-size: 14pt; letter-spacing: 1.5px; }
  .solo-foot .fb .dot { color: #FFD000; }
  .solo-foot .ft { font-size: 8.5pt; color: #bdbdbd; font-weight: 500; text-align: right; }
  .solo-foot .ft b { color: #FFD000; font-weight: 800; }

  /* ── loading / error ── */
  .msg { color: #ddd; text-align: center; padding: 80px 20px; font-size: .95rem; }

  /* ── screen scaling for small viewports ── */
  @media screen and (max-width: 840px) {
    .stage { padding: 20px 0 50px; }
    .sheet { transform: scale(.62); transform-origin: top center; margin-bottom: -113mm; }
  }
  @media screen and (max-width: 480px) {
    .sheet { transform: scale(.44); margin-bottom: -166mm; }
  }

  /* ── PRINT ── */
  @media print {
    @page { size: A4; margin: 0; }
    body { background: #fff; }
    .toolbar, .hint { display: none !important; }
    .stage { padding: 0; }
    .sheet { box-shadow: none; transform: none !important; margin: 0 !important;
             width: 210mm; height: 297mm; }
  }
</style>
</head>
<body>

<div class="toolbar">
  <span class="tb-title">🖨️ Printable Menu QR</span>
  <div class="tb-seg" id="seg">
    <button data-mode="quad" class="active">4 per page</button>
    <button data-mode="solo">Full poster</button>
  </div>
  <button class="tb-print" id="print-btn">Print / Save PDF</button>
  <a class="tb-back" id="back-link" href="/account/menu-builder.html">‹ Back</a>
</div>

<div class="stage">
  <div id="root"><div class="msg">Loading your poster…</div></div>
</div>

<!-- hidden QR render target -->
<div id="qr-src" style="position:absolute;left:-9999px;top:-9999px"></div>

<script src="../assets/js/config.js"></script>
<script src="../assets/js/supabase-client.js?v=v25"></script>
<script src="https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs@gh-pages/qrcode.min.js"></script>
<script>
(function () {
  var slug = new URLSearchParams(location.search).get('slug');
  var root = document.getElementById('root');
  var mode = 'quad';
  var rest = null, menuUrl = '', qrDataUrl = '';

  if (!slug) { root.innerHTML = '<div class="msg">No restaurant specified.</div>'; return; }

  var bl = document.getElementById('back-link');
  bl.href = '/account/menu-builder.html';

  function esc(s){ return String(s||'').replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  function makeQR(url) {
    var box = document.getElementById('qr-src');
    box.innerHTML = '';
    if (typeof QRCode !== 'function') return '';
    new QRCode(box, { text: url, width: 600, height: 600,
      colorDark: '#111111', colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.H });
    var img = box.querySelector('img');
    var cv  = box.querySelector('canvas');
    if (img && img.src && img.src.indexOf('data:') === 0) return img.src;
    if (cv) { try { return cv.toDataURL('image/png'); } catch(e){} }
    return img ? img.src : '';
  }

  var BRACKETS = '<span class="qbr tl"></span><span class="qbr tr"></span>' +
                 '<span class="qbr bl"></span><span class="qbr br"></span>';

  /* Sleek line-art icons for the feature chips. */
  var SVG = 'xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" ' +
            'stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"';
  var ICON = {
    camera:  '<svg ' + SVG + '><path d="M3 8.5A2 2 0 0 1 5 6.5h1.6l1.1-1.8a1 1 0 0 1 .9-.5h6.8a1 1 0 0 1 .9.5l1.1 1.8H19a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/><circle cx="12" cy="12.5" r="3.3"/></svg>',
    tag:     '<svg ' + SVG + '><path d="M3.5 12.3V4.8a1.3 1.3 0 0 1 1.3-1.3h7.5a1.3 1.3 0 0 1 .9.4l7 7a1.3 1.3 0 0 1 0 1.8l-6.5 6.5a1.3 1.3 0 0 1-1.8 0l-7-7a1.3 1.3 0 0 1-.4-.9Z"/><circle cx="8" cy="8" r="1.4"/></svg>',
    star:    '<svg ' + SVG + '><path d="M12 3.5l2.6 5.3 5.9.85-4.25 4.15 1 5.85L12 17.2l-5.25 2.75 1-5.85L3.5 9.65l5.9-.85Z"/></svg>',
    refresh: '<svg ' + SVG + '><path d="M20 11.5A8 8 0 0 0 6.3 6.3L4 8.5"/><path d="M4 4.5v4h4"/><path d="M4 12.5A8 8 0 0 0 17.7 17.7L20 15.5"/><path d="M20 19.5v-4h-4"/></svg>',
  };

  function quarterHTML() {
    return '' +
      '<div class="qp">' +
        '<div class="qp-band">' +
          '<div class="bw font-d">YUMYUM<span class="dot">PO</span></div>' +
          '<div class="bs">Discover · Scan · Savor</div>' +
        '</div>' +
        '<div class="qp-head font-d">Our menu is<br><span class="hl">on your phone</span></div>' +
        '<div class="qp-qr-wrap">' +
          '<div class="qp-qr"><img src="' + qrDataUrl + '" alt="Menu QR"></div>' +
          BRACKETS +
        '</div>' +
        '<div class="qp-scan">📷 Point your camera to scan</div>' +
        '<div class="qp-name">' + esc(rest.name) + '</div>' +
        '<div class="qp-foot">Free · No app needed · <b>Powered by YUMYUMPO</b></div>' +
      '</div>';
  }

  function renderQuad() {
    var cell = quarterHTML();
    root.innerHTML =
      '<div class="sheet"><div class="quad">' +
        cell + cell + cell + cell +
        '<div class="cutlines">' +
          '<span class="cl-v"></span><span class="cl-h"></span>' +
          '<span class="sc sc-t">✂</span><span class="sc sc-b">✂</span>' +
          '<span class="sc sc-l">✂</span><span class="sc sc-r">✂</span>' +
        '</div>' +
      '</div></div>';
  }

  function renderSolo() {
    var cover = rest.cover_image_url || rest.image || '';
    var heroStyle = cover
      ? 'background-image:url(\'' + cover + '\')'
      : 'background:linear-gradient(135deg,#222,#000)';
    var logo = rest.logo_image_url || '';
    var logoInner = logo
      ? 'style="background-image:url(\'' + logo + '\')"'
      : 'style=""';
    var logoEmoji = logo ? '' : '🍽️';
    var cuisine = rest.cuisine || rest.category || '';

    root.innerHTML =
      '<div class="sheet"><div class="solo">' +
        '<div class="solo-hero" style="' + heroStyle + '">' +
          '<div class="solo-topbrand font-d">YUMYUM<span class="dot">PO</span></div>' +
          '<div class="solo-logo" ' + logoInner + '>' + logoEmoji + '</div>' +
          '<div class="solo-name font-d">' + esc(rest.name) + '</div>' +
          (cuisine ? '<div><span class="solo-cuisine">' + esc(cuisine) + '</span></div>' : '') +
        '</div>' +
        '<div class="solo-strip">' +
          '<div class="st font-d">Scan for our digital menu ↓</div>' +
          '<div class="ss">Point your phone camera at the code</div>' +
        '</div>' +
        '<div class="solo-body">' +
          '<div class="solo-qr-wrap">' +
            '<div class="solo-qr"><img src="' + qrDataUrl + '" alt="Menu QR"></div>' +
            BRACKETS +
          '</div>' +
          '<div class="solo-scan">📷 No app needed — just your camera</div>' +
          '<div class="solo-feats">' +
            '<div class="solo-feat"><div class="fi">' + ICON.camera + '</div><div class="fl">Real food photos</div></div>' +
            '<div class="solo-feat"><div class="fi">' + ICON.tag + '</div><div class="fl">Live prices</div></div>' +
            '<div class="solo-feat"><div class="fi">' + ICON.star + '</div><div class="fl">Best sellers</div></div>' +
            '<div class="solo-feat"><div class="fi">' + ICON.refresh + '</div><div class="fl">Always updated</div></div>' +
          '</div>' +
          '<div class="solo-steps">' +
            '<div class="solo-step"><div class="n">1</div><div class="t">Open your camera</div></div>' +
            '<div class="solo-step"><div class="n">2</div><div class="t">Point at the code</div></div>' +
            '<div class="solo-step"><div class="n">3</div><div class="t">Tap &amp; explore the menu</div></div>' +
          '</div>' +
        '</div>' +
        '<div class="solo-foot">' +
          '<div class="fb font-d">YUMYUM<span class="dot">PO</span></div>' +
          '<div class="ft">The Philippines’ restaurant discovery app<br><b>Discover · Scan · Savor</b></div>' +
        '</div>' +
      '</div></div>';
  }

  function render() {
    if (mode === 'quad') renderQuad(); else renderSolo();
  }

  document.getElementById('seg').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    mode = b.dataset.mode;
    [].forEach.call(this.children, function (c) { c.classList.toggle('active', c === b); });
    render();
  });
  document.getElementById('print-btn').addEventListener('click', function () { window.print(); });

  function start() {
    var get = window.db && window.db.getRestaurantBySlug
      ? window.db.getRestaurantBySlug(slug)
      : Promise.resolve(null);
    Promise.resolve(get).then(function (r) {
      if (!r) { root.innerHTML = '<div class="msg">Restaurant not found.</div>'; return; }
      rest = r;
      bl.href = '/account/menu-builder.html';
      menuUrl = location.origin + '/menu?slug=' + encodeURIComponent(r.slug || slug);
      qrDataUrl = makeQR(menuUrl);
      render();
    }).catch(function () {
      root.innerHTML = '<div class="msg">Could not load this restaurant.</div>';
    });
  }

  if (window.YYP && window.YYP.ready) start();
  else document.addEventListener('yyp:ready', start, { once: true });
  /* fallback in case the ready event already fired */
  setTimeout(function () { if (!rest) start(); }, 1200);
})();
</script>
</body>
</html>
