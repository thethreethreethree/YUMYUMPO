<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ask Fred — Food & Restaurant Experience Discovery · YUMYUMPO</title>
  <meta name="description" content="Meet Fred — YUMYUMPO's Food & Restaurant Experience Discovery AI. Tell Fred what you're craving, your vibe, or your occasion and get the perfect restaurant recommendation instantly." />
  <link rel="icon" href="assets/images/YUMYUMPO LOGO.png" type="image/png" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'brand-yellow': '#FFD000',
            'brand-black':  '#111111',
            'warm-orange':  '#FFD000',
            'charcoal':     '#111111',
            'warm-white':   '#FAFAFA',
            'stone-pale':   '#F5F5F4',
            'stone-mid':    '#6B6B6B',
          },
          fontFamily: {
            display: ['"Space Grotesk"', 'sans-serif'],
            sans:    ['"Space Grotesk"', 'sans-serif'],
          },
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="assets/css/styles.css" />

  <style>
    :root {
      --yellow: #FFD000;
      --yellow-glow: rgba(255, 208, 0, 0.18);
      --black: #111111;
      --surface: #181818;
      --surface2: #222222;
      --border: #2A2A2A;
      --muted: #888888;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }

    body {
      background: #111111;
      font-family: 'Space Grotesk', sans-serif;
      color: #fff;
      -webkit-font-smoothing: antialiased;
    }

    /* ─── NAVBAR ─────────────────────────────────────── */
    #fred-nav {
      background: rgba(17,17,17,0.9);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
    }

    /* ─── HERO ─────────────────────────────────────────
       Two states: welcome (full hero visible) → chat (hero shrinks to topbar)
    ──────────────────────────────────────────────────── */
    #fred-hero {
      transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Ambient glow behind Fred avatar */
    .fred-glow {
      position: absolute;
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(255,208,0,0.12) 0%, transparent 70%);
      top: 50%; left: 50%;
      transform: translate(-50%, -60%);
      pointer-events: none;
      border-radius: 50%;
    }

    /* Fred avatar */
    .fred-avatar {
      width: 88px; height: 88px;
      background: var(--yellow);
      border-radius: 28px;
      display: flex; align-items: center; justify-content: center;
      font-size: 2.5rem;
      box-shadow: 0 0 0 12px rgba(255,208,0,0.08), 0 20px 60px rgba(255,208,0,0.3);
      position: relative;
      flex-shrink: 0;
    }
    .fred-avatar::after {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 32px;
      background: linear-gradient(135deg, rgba(255,208,0,0.4), transparent);
      z-index: -1;
    }

    /* Fred avatar small (compact topbar mode) */
    .fred-avatar-sm {
      width: 36px; height: 36px;
      background: var(--yellow);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem;
      flex-shrink: 0;
    }

    /* FRED acronym breakdown */
    .fred-acronym span {
      display: inline-block;
      transition: color 0.2s;
    }
    .fred-acronym:hover span { color: var(--yellow); }

    /* ─── MAIN SEARCH INPUT ──────────────────────────── */
    .fred-search-wrap {
      background: #1C1C1C;
      border: 2px solid var(--border);
      border-radius: 20px;
      transition: border-color 0.25s, box-shadow 0.25s;
      position: relative;
    }
    .fred-search-wrap:focus-within {
      border-color: var(--yellow);
      box-shadow: 0 0 0 4px rgba(255,208,0,0.10);
    }

    #fred-input {
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1rem;
      width: 100%;
    }
    #fred-input::placeholder { color: #555; }

    #fred-send {
      background: var(--yellow);
      color: var(--black);
      border: none;
      border-radius: 12px;
      width: 44px; height: 44px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.15s;
      flex-shrink: 0;
      font-weight: 800;
    }
    #fred-send:hover  { opacity: 0.88; transform: scale(1.05); }
    #fred-send:active { transform: scale(0.95); }
    #fred-send:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }

    /* ─── EXAMPLE PROMPT CHIPS ───────────────────────── */
    .prompt-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #1C1C1C;
      border: 1.5px solid var(--border);
      color: #CCC;
      border-radius: 999px;
      padding: 8px 16px;
      font-size: 0.8125rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.18s ease;
    }
    .prompt-chip:hover {
      background: var(--yellow);
      border-color: var(--yellow);
      color: var(--black);
      transform: translateY(-2px);
    }

    /* ─── VIBE TILES ─────────────────────────────────── */
    .vibe-tile {
      background: #1C1C1C;
      border: 1.5px solid var(--border);
      border-radius: 16px;
      padding: 16px 12px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .vibe-tile:hover {
      background: #252525;
      border-color: var(--yellow);
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(255,208,0,0.12);
    }
    .vibe-tile .emoji { font-size: 1.75rem; display: block; margin-bottom: 6px; }
    .vibe-tile .label { font-size: 0.75rem; font-weight: 700; color: #999; }

    /* ─── CONVERSATION THREAD ────────────────────────── */
    #chat-thread { display: none; }

    .msg-user {
      background: var(--yellow);
      color: var(--black);
      border-radius: 18px 18px 4px 18px;
      font-weight: 600;
    }

    .msg-fred {
      background: var(--surface);
      color: #F0F0F0;
      border: 1px solid var(--border);
      border-radius: 18px 18px 18px 4px;
      line-height: 1.6;
    }

    /* ─── TYPING DOTS ────────────────────────────────── */
    .tdot {
      width: 6px; height: 6px;
      background: #555;
      border-radius: 50%;
      animation: tdot 1.2s infinite ease-in-out;
    }
    .tdot:nth-child(2) { animation-delay: 0.2s; }
    .tdot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes tdot {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.5; }
      40%           { transform: translateY(-5px); opacity: 1; }
    }

    /* ─── RESULT CARDS ───────────────────────────────── */
    .fred-card {
      background: #1A1A1A;
      border: 1.5px solid var(--border);
      border-radius: 18px;
      overflow: hidden;
      cursor: pointer;
      transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s;
    }
    .fred-card:hover {
      border-color: var(--yellow);
      transform: translateY(-3px);
      box-shadow: 0 12px 32px rgba(255,208,0,0.1);
    }
    .fred-card img {
      width: 100%; height: 150px;
      object-fit: cover;
      display: block;
    }
    .fred-card-body { padding: 14px; }

    .match-bar-track {
      height: 2px;
      background: #2A2A2A;
      border-radius: 2px;
      flex: 1;
    }
    .match-bar-fill {
      height: 2px;
      background: var(--yellow);
      border-radius: 2px;
      transition: width 0.7s ease;
    }

    .fred-tag {
      background: rgba(255,208,0,0.1);
      color: var(--yellow);
      border-radius: 999px;
      padding: 2px 9px;
      font-size: 0.68rem;
      font-weight: 700;
    }

    /* ─── FOLLOW-UP CHIPS ────────────────────────────── */
    .follow-chip {
      background: #1C1C1C;
      border: 1px solid var(--border);
      color: #CCC;
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
    }
    .follow-chip:hover {
      background: var(--yellow);
      border-color: var(--yellow);
      color: var(--black);
    }

    /* ─── COMPACT SEARCH BAR (chat mode) ────────────── */
    #compact-search-bar {
      display: none;
      border-bottom: 1px solid var(--border);
      background: rgba(17,17,17,0.95);
      backdrop-filter: blur(12px);
    }

    #compact-input {
      background: #1C1C1C;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      color: #fff;
      outline: none;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.875rem;
      padding: 10px 16px;
      flex: 1;
      transition: border-color 0.2s;
    }
    #compact-input:focus { border-color: var(--yellow); }
    #compact-input::placeholder { color: #555; }

    #compact-send {
      background: var(--yellow);
      color: var(--black);
      border: none;
      border-radius: 10px;
      width: 38px; height: 38px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: opacity 0.15s;
    }
    #compact-send:hover { opacity: 0.85; }
    #compact-send:disabled { opacity: 0.35; cursor: not-allowed; }

    /* ─── SCROLL ─────────────────────────────────────── */
    #chat-scroll {
      scrollbar-width: thin;
      scrollbar-color: #2A2A2A transparent;
    }
    #chat-scroll::-webkit-scrollbar { width: 4px; }
    #chat-scroll::-webkit-scrollbar-thumb { background: #2A2A2A; border-radius: 2px; }

    /* ─── ANIMATIONS ─────────────────────────────────── */
    .fade-in { opacity: 0; transform: translateY(12px); transition: opacity 0.4s ease, transform 0.4s ease; }
    .fade-in.show { opacity: 1; transform: translateY(0); }

    /* star colors */
    .s-on  { color: var(--yellow); }
    .s-off { color: #333; }

    /* ─── STATUS BADGE ───────────────────────────────── */
    .fred-status {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(255,208,0,0.08);
      border: 1px solid rgba(255,208,0,0.2);
      border-radius: 999px;
      padding: 4px 12px;
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--yellow);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .fred-status-dot {
      width: 6px; height: 6px;
      background: var(--yellow);
      border-radius: 50%;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.5; transform: scale(0.8); }
    }

    /* ─── DIVIDER ─────────────────────────────────────── */
    .or-divider {
      display: flex; align-items: center; gap: 12px;
      color: #444; font-size: 0.75rem; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.08em;
    }
    .or-divider::before, .or-divider::after {
      content: ''; flex: 1; height: 1px; background: var(--border);
    }
  </style>
</head>
<body>

  <!-- ════════════════════════════════════════════════
       NAVBAR — matches homepage
  ════════════════════════════════════════════════ -->
  <nav id="fred-nav" class="fixed top-0 left-0 right-0 z-50 h-16 px-4 md:px-8 flex items-center justify-between">
    <a href="index.html" class="flex items-center gap-2.5 shrink-0">
      <img src="assets/images/YUMYUMPO LOGO.png" alt="YUMYUMPO" class="h-8 w-auto" onerror="this.style.display='none'" />
      <span class="font-display font-extrabold text-lg text-white hidden sm:block tracking-tight">YUMYUMPO</span>
    </a>
    <div class="flex items-center gap-3">
      <div class="fred-status hidden md:inline-flex">
        <span class="fred-status-dot"></span>
        Fred is ready
      </div>
      <a href="discover.html" class="text-sm font-semibold text-gray-400 hover:text-white transition-colors">Browse All</a>
      <a href="index.html" class="text-sm font-bold bg-brand-yellow text-brand-black px-4 py-2 rounded-full hover:opacity-90 transition-opacity">Home</a>
    </div>
  </nav>


  <!-- ════════════════════════════════════════════════
       COMPACT SEARCH BAR — visible only in chat mode
  ════════════════════════════════════════════════ -->
  <div id="compact-search-bar" class="fixed top-16 left-0 right-0 z-40 px-4 py-3">
    <div class="max-w-2xl mx-auto flex items-center gap-2">
      <div class="fred-avatar-sm">🍽️</div>
      <input id="compact-input" type="text" placeholder="Ask Fred something else..." autocomplete="off" maxlength="280" />
      <button id="compact-send" aria-label="Send">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>
  </div>


  <!-- ════════════════════════════════════════════════
       WELCOME HERO — full screen, centered
  ════════════════════════════════════════════════ -->
  <div id="fred-hero" class="relative min-h-screen flex flex-col items-center justify-center px-4 pt-16 pb-12 overflow-hidden">

    <!-- ambient glow -->
    <div class="fred-glow"></div>

    <!-- subtle dot grid (matches homepage AI section) -->
    <div class="absolute inset-0 opacity-[0.025] pointer-events-none" style="background-image: radial-gradient(circle at 1.5px 1.5px, white 1px, transparent 0); background-size: 32px 32px;"></div>

    <div class="relative z-10 w-full max-w-2xl mx-auto text-center">

      <!-- Fred identity -->
      <div class="flex flex-col items-center mb-8">
        <div class="fred-avatar mb-6">🍽️</div>

        <div class="fred-status mb-5">
          <span class="fred-status-dot"></span>
          Food &amp; Restaurant Experience Discovery
        </div>

        <h1 class="font-display font-black text-white mb-3" style="font-size: clamp(2.5rem, 8vw, 4.5rem); line-height: 1.05; letter-spacing: -0.03em;">
          Hey, I'm <span class="text-brand-yellow">Fred.</span>
        </h1>

        <p class="text-gray-400 text-lg md:text-xl font-medium max-w-md mx-auto leading-relaxed">
          Tell me what you're craving, your vibe, or your occasion —<br class="hidden md:block" />
          I'll find the perfect spot.
        </p>
      </div>

      <!-- ── MAIN SEARCH BAR ── -->
      <div class="fred-search-wrap mb-5 w-full">
        <div class="flex items-center gap-3 p-3">
          <div class="text-xl pl-1 flex-shrink-0 select-none">🔍</div>
          <input
            id="fred-input"
            type="text"
            placeholder="Romantic dinner in BGC, budget ramen in Makati..."
            autocomplete="off"
            maxlength="280"
            class="flex-1 py-2 text-base"
          />
          <button id="fred-send" aria-label="Ask Fred">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- ── EXAMPLE PROMPT CHIPS (horizontal scroll) ── -->
      <div class="flex gap-2 overflow-x-auto pb-2 mb-10 justify-start md:justify-center hide-scrollbar" id="prompt-chips">
        <!-- injected by JS -->
      </div>

      <!-- ── divider ── -->
      <div class="or-divider mb-8">or browse by vibe</div>

      <!-- ── VIBE TILES GRID ── -->
      <div class="grid grid-cols-4 sm:grid-cols-6 gap-3" id="vibe-grid">
        <!-- injected by JS -->
      </div>

    </div>
  </div>


  <!-- ════════════════════════════════════════════════
       CHAT THREAD — hidden until first query
  ════════════════════════════════════════════════ -->
  <div id="chat-thread">
    <div id="chat-scroll" class="overflow-y-auto px-4 pb-24" style="height: calc(100vh - 112px); padding-top: 24px;">
      <div id="chat-messages" class="max-w-2xl mx-auto space-y-6">
        <!-- messages injected here -->
      </div>
    </div>
  </div>


  <!-- ════════════════════════════════════════════════
       SCRIPTS
  ════════════════════════════════════════════════ -->
  <script src="assets/js/analytics.js"></script>
  <script src="assets/js/ai-search.js"></script>

  <script>
  (function () {
    'use strict';

    /* ── DOM ── */
    const hero          = document.getElementById('fred-hero');
    const chatThread    = document.getElementById('chat-thread');
    const chatMessages  = document.getElementById('chat-messages');
    const chatScroll    = document.getElementById('chat-scroll');
    const compactBar    = document.getElementById('compact-search-bar');
    const fredInput     = document.getElementById('fred-input');
    const fredSend      = document.getElementById('fred-send');
    const compactInput  = document.getElementById('compact-input');
    const compactSend   = document.getElementById('compact-send');
    const promptChips   = document.getElementById('prompt-chips');
    const vibeGrid      = document.getElementById('vibe-grid');

    let chatStarted = false;

    /* ════════════════════════════════════════
       WELCOME CONTENT
    ════════════════════════════════════════ */
    const PROMPTS = [
      { icon: '🌊', text: 'Best seafood in Siargao for backpackers' },
      { icon: '💑', text: 'Romantic dinner for two in BGC' },
      { icon: '🍜', text: 'Cheap ramen under ₱400 in Makati' },
      { icon: '📸', text: 'Instagrammable café in Cebu' },
      { icon: '🏖️', text: 'Beachfront spot for sunset drinks' },
      { icon: '🌿', text: 'Vegan-friendly lunch near the city' },
      { icon: '🍖', text: 'Best BBQ for a big group in Cebu' },
    ];

    PROMPTS.forEach(p => {
      const btn = document.createElement('button');
      btn.className = 'prompt-chip';
      btn.innerHTML = `<span>${p.icon}</span><span>${p.text}</span>`;
      btn.addEventListener('click', () => submitQuery(p.text));
      promptChips.appendChild(btn);
    });

    const VIBES = [
      { emoji: '💑', label: 'Date Night' },
      { emoji: '🎒', label: 'Backpacker' },
      { emoji: '🌅', label: 'Beachfront' },
      { emoji: '📸', label: 'Aesthetic' },
      { emoji: '💎', label: 'Hidden Gem' },
      { emoji: '🌙', label: 'Late Night' },
      { emoji: '💸', label: 'Budget Pick' },
      { emoji: '🌿', label: 'Healthy' },
      { emoji: '🍺', label: 'Night Out' },
      { emoji: '👨‍👩‍👧', label: 'Family' },
      { emoji: '🍣', label: 'Japanese' },
      { emoji: '☕', label: 'Café' },
    ];

    VIBES.forEach(v => {
      const btn = document.createElement('button');
      btn.className = 'vibe-tile';
      btn.innerHTML = `<span class="emoji">${v.emoji}</span><span class="label">${v.label}</span>`;
      btn.addEventListener('click', () => submitQuery(v.label + ' restaurants in the Philippines'));
      vibeGrid.appendChild(btn);
    });

    /* ════════════════════════════════════════
       TRANSITION: hero → chat mode
    ════════════════════════════════════════ */
    function switchToChatMode() {
      if (chatStarted) return;
      chatStarted = true;

      /* fade hero out */
      hero.style.transition = 'opacity 0.35s ease';
      hero.style.opacity = '0';
      setTimeout(() => {
        hero.style.display = 'none';
        /* show chat layout */
        chatThread.style.display = 'block';
        compactBar.style.display = 'block';
        compactInput.focus();
      }, 350);
    }

    /* ════════════════════════════════════════
       MESSAGE RENDERING
    ════════════════════════════════════════ */
    function msg(html, cls) {
      const wrap = document.createElement('div');
      wrap.className = `fade-in ${cls}`;
      wrap.innerHTML = html;
      chatMessages.appendChild(wrap);
      requestAnimationFrame(() => requestAnimationFrame(() => wrap.classList.add('show')));
      scrollToBottom();
      return wrap;
    }

    function appendUser(text) {
      msg(`
        <div class="flex justify-end">
          <div class="msg-user px-5 py-3 text-sm max-w-[80%]">${esc(text)}</div>
        </div>
      `, '');
    }

    function appendTyping() {
      return msg(`
        <div class="flex items-start gap-3">
          <div class="fred-avatar-sm flex-shrink-0 mt-1">🍽️</div>
          <div class="msg-fred px-5 py-4 flex items-center gap-1.5" id="typing-indicator">
            <div class="tdot"></div>
            <div class="tdot"></div>
            <div class="tdot"></div>
          </div>
        </div>
      `, '');
    }

    function removeTyping() {
      document.getElementById('typing-indicator')?.closest('.fade-in')?.remove();
    }

    function appendFred(text, chips = []) {
      msg(`
        <div class="flex items-start gap-3">
          <div class="fred-avatar-sm flex-shrink-0 mt-1">🍽️</div>
          <div class="flex-1 min-w-0">
            <div class="msg-fred px-5 py-4 text-sm">
              ${formatText(text)}
            </div>
            ${chips.length ? `
              <div class="flex gap-2 flex-wrap mt-3">
                ${chips.slice(0, 5).map(c => `<button class="follow-chip" onclick="window._fredSubmit('${esc(c)}')">${esc(c)}</button>`).join('')}
              </div>` : ''}
          </div>
        </div>
      `, '');
    }

    function appendCards(restaurants) {
      if (!restaurants?.length) return;
      const top4 = restaurants.slice(0, 4);
      const wrap = document.createElement('div');
      wrap.className = 'fade-in pl-12';
      wrap.innerHTML = `
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mt-1">
          ${top4.map(r => cardHTML(r)).join('')}
        </div>
      `;
      chatMessages.appendChild(wrap);
      requestAnimationFrame(() => requestAnimationFrame(() => wrap.classList.add('show')));

      wrap.querySelectorAll('.fred-card').forEach(card => {
        card.addEventListener('click', () => {
          const slug = card.dataset.slug;
          if (typeof trackWebsiteClick === 'function') trackWebsiteClick('profile', slug);
          window.location.href = `restaurant.html?id=${slug}`;
        });
      });

      scrollToBottom();
    }

    function cardHTML(r) {
      const score  = r._score ? Math.round(r._score) : null;
      const img    = r.cover_image || r.image || 'https://placehold.co/400x160/1A1A1A/FFD000?text=🍽️';
      const stars  = starsHTML(r.rating || 4);
      const tags   = (r.tags || []).slice(0, 2).map(t => `<span class="fred-tag">${esc(t)}</span>`).join('');
      const slug   = r.slug || r.id || '';

      return `
        <div class="fred-card" data-slug="${slug}">
          <img src="${esc(img)}" alt="${esc(r.name)}"
               loading="lazy"
               onerror="this.src='https://placehold.co/400x160/1A1A1A/FFD000?text=🍽️'" />
          <div class="fred-card-body">
            ${score ? `
              <div class="flex items-center gap-2 mb-2">
                <div class="match-bar-track"><div class="match-bar-fill" style="width:${score}%"></div></div>
                <span style="font-size:0.7rem;color:#666;font-weight:700;white-space:nowrap">${score}% match</span>
              </div>` : ''}
            <h3 style="font-size:0.9rem;font-weight:800;color:#fff;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(r.name)}</h3>
            <p style="font-size:0.75rem;color:#666;margin-bottom:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(r.cuisine || '')} · 📍 ${esc(r.location || '')}</p>
            <div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
              <div style="display:flex;align-items:center;gap:4px">
                ${stars}
                <span style="font-size:0.75rem;color:#666">${(r.rating || 4).toFixed(1)}</span>
              </div>
              <div style="display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end">${tags}</div>
            </div>
          </div>
        </div>
      `;
    }

    function starsHTML(rating) {
      let h = '';
      for (let i = 1; i <= 5; i++)
        h += `<span class="${i <= Math.floor(rating) ? 's-on' : 's-off'}" style="font-size:0.75rem">★</span>`;
      return h;
    }

    /* ════════════════════════════════════════
       QUERY PIPELINE
    ════════════════════════════════════════ */
    async function submitQuery(rawQuery) {
      const query = rawQuery.trim();
      if (!query) return;

      switchToChatMode();

      fredInput.value = '';
      compactInput.value = '';
      fredSend.disabled = true;
      compactSend.disabled = true;

      appendUser(query);
      const typingEl = appendTyping();

      try {
        const result = await YAI.query(query);
        removeTyping();

        const opening = result.opening || result.message || 'Here\'s what I found! 🍽️';
        appendFred(opening, result.followUp || []);

        if (result.restaurants?.length) {
          appendCards(result.restaurants);
          if (result.closing) {
            setTimeout(() => appendFred(result.closing), 350);
          }
        } else {
          appendFred('No exact matches — try a different vibe or location? I can also help with cuisine type, budget, or occasion 🤔');
        }

        if (typeof YAn !== 'undefined') {
          YAn.track('fred_search', { query, results: (result.restaurants || []).length });
        }

      } catch (err) {
        removeTyping();
        appendFred('Something went wrong on my end — give it another go? 😅');
        console.error('[Fred]', err);
      }

      fredSend.disabled = false;
      compactSend.disabled = false;
      compactInput.focus();
    }

    /* expose for inline follow-up chip clicks */
    window._fredSubmit = submitQuery;

    /* ════════════════════════════════════════
       INIT
    ════════════════════════════════════════ */
    function init() {
      /* hero input */
      fredInput.addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submitQuery(fredInput.value); }
      });
      fredSend.addEventListener('click', () => submitQuery(fredInput.value));

      /* compact input */
      compactInput.addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submitQuery(compactInput.value); }
      });
      compactSend.addEventListener('click', () => submitQuery(compactInput.value));

      /* URL pre-query (from discover page "Ask Fred" link) */
      const q = new URLSearchParams(window.location.search).get('q');
      if (q) setTimeout(() => submitQuery(q), 500);
      else fredInput.focus();
    }

    /* ── helpers ── */
    function scrollToBottom() {
      setTimeout(() => chatScroll.scrollTo({ top: chatScroll.scrollHeight, behavior: 'smooth' }), 60);
    }

    function esc(s) {
      return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function formatText(s) {
      return String(s)
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/\n/g, '<br>');
    }

    document.addEventListener('DOMContentLoaded', init);
    if (document.readyState !== 'loading') init();

  })();
  </script>

</body>
</html>
